name: Vectorforge - build Windows app

# Builds Vectorforge.exe and VectorforgeSetup.exe on a Windows runner.
# Runs when a tag like "vectorforge-v1.0.1" is pushed (and publishes a GitHub Release),
# or manually from the Actions tab (files appear under the run's Artifacts).

on:
  workflow_dispatch:
  push:
    tags: ["vectorforge-v*"]

permissions:
  contents: write

defaults:
  run:
    working-directory: web-applications/vectorforge

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest httpx
      - name: Run tests
        run: python -m pytest -q
      - name: Build app
        run: pyinstaller packaging/vectorforge.spec --noconfirm --clean
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $env:VF_NO_BROWSER = "1"; $env:VF_PORT = "8123"
          $p = Start-Process dist\Vectorforge\Vectorforge.exe -PassThru
          Start-Sleep -Seconds 25
          Invoke-RestMethod http://127.0.0.1:8123/api/v1/health
          Stop-Process -Id $p.Id
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
          Compress-Archive -Path dist\Vectorforge -DestinationPath dist\Vectorforge-portable-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Vectorforge-windows
          path: |
            web-applications/vectorforge/dist/VectorforgeSetup.exe
            web-applications/vectorforge/dist/Vectorforge-portable-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Vectorforge ${{ github.ref_name }}
          body_path: web-applications/vectorforge/CHANGELOG.md
          files: |
            web-applications/vectorforge/dist/VectorforgeSetup.exe
            web-applications/vectorforge/dist/Vectorforge-portable-windows.zip
